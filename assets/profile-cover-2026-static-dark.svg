<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Pavel Putrenkov — complex inputs, clear outcomes</title>
  <desc id="desc">Pavel Putrenkov, Senior Java Engineer. Complex inputs, clear outcomes.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#111318"/><stop offset="1" stop-color="#20242B"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#BE8751" stop-opacity=".16"/><stop offset="1" stop-color="#BE8751" stop-opacity="0"/></radialGradient>
    <linearGradient id="streak"><stop stop-color="#E9B47A" stop-opacity="0"/><stop offset=".5" stop-color="#E9B47A"/><stop offset="1" stop-color="#E9B47A" stop-opacity="0"/></linearGradient>
    <style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; } text.monogram { font-family: Georgia, "Times New Roman", serif; } @media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="429" rx="18" fill="url(#background)" stroke="#373B41"/>

  <circle cx="997" cy="195" r="260" fill="url(#glow)"/>
  <circle cx="995" cy="211" r="154" fill="none" stroke="#E9B47A" stroke-opacity=".42" stroke-width="1.5"/>
  <circle cx="995" cy="211" r="122" fill="none" stroke="#62615D" stroke-opacity=".45"/>
  <text class="monogram" x="890" y="311" fill="#E9B47A" fill-opacity=".20" font-size="285" font-style="italic">P</text>
  <circle cx="1095" cy="304" r="13" fill="#E9B47A"/>
  <rect x="60" y="47" width="38" height="4" rx="2" fill="#E9B47A"/>
  <text x="111" y="52" fill="#E9B47A" font-size="18" font-weight="700" letter-spacing="2">SENIOR JAVA ENGINEER · SPRING BOOT</text>
  <text x="60" y="133" fill="#F8F5EF" font-size="58" font-weight="700">Pavel Putrenkov</text>
  <text x="60" y="221" fill="#F8F5EF" font-size="62" font-weight="700">Complex inputs.</text>
  <text x="60" y="291" fill="#E9B47A" font-size="62" font-weight="700">Clear outcomes.</text>
  <text x="60" y="339" fill="#D5D0C7" font-size="21">Payments, documents and dependable APIs.</text>
  <line x1="60" y1="377" x2="1140" y2="377" stroke="#62615D" stroke-opacity=".65"/>
  <text x="60" y="409" fill="#A9AAA8" font-size="16" font-weight="600" letter-spacing="1.5">PAYMENTS  /  DOCUMENTS  /  DEVELOPER TOOLING</text>
