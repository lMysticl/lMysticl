<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Pavel Putrenkov — Java and Spring backend engineer</title>
  <desc id="desc">A system blueprint from document ingestion through analysis, validation, and delivery.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <linearGradient id="pipeline" x1="78" y1="0" x2="922" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="1" opacity=".22"/>
    </pattern>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      }
      @media (prefers-reduced-motion: reduce) {
        .motion {
          display: none;
        }
      }
    </style>
  </defs>

  <rect x=".5" y=".5" width="999" height="319" rx="18" fill="url(#background)" stroke="#30363d"/>
  <rect x="1" y="1" width="998" height="318" rx="17" fill="url(#grid)"/>

  <rect x="48" y="31" width="48" height="4" rx="2" fill="#58a6ff"/>
  <rect x="102" y="31" width="28" height="4" rx="2" fill="#2dd4bf"/>
  <text x="48" y="56" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="2.2">BACKEND SYSTEMS · DOCUMENT PROCESSING</text>
  <text x="952" y="56" fill="#8b949e" font-size="12" text-anchor="end" letter-spacing="1.2">CORRECTNESS · CONTRACTS · DELIVERY</text>

  <text x="48" y="102" fill="#f0f6fc" font-size="38" font-weight="700">Pavel Putrenkov</text>
  <text x="48" y="134" fill="#b1bac4" font-size="17">Java &amp; Spring engineer building reliable document-processing systems and APIs.</text>

  <g class="mono" font-size="12" font-weight="600">
    <rect x="48" y="154" width="86" height="28" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="91" y="173" fill="#f0f6fc" text-anchor="middle">JAVA 21</text>
    <rect x="144" y="154" width="116" height="28" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="202" y="173" fill="#f0f6fc" text-anchor="middle">SPRING BOOT</text>
    <rect x="270" y="154" width="88" height="28" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="314" y="173" fill="#f0f6fc" text-anchor="middle">PDFBOX</text>
    <rect x="368" y="154" width="94" height="28" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="415" y="173" fill="#f0f6fc" text-anchor="middle">REST APIs</text>
  </g>

  <line x1="48" y1="202" x2="952" y2="202" stroke="#30363d"/>
  <text x="48" y="225" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="1.8">SYSTEM BLUEPRINT</text>

  <line x1="78" y1="252" x2="922" y2="252" stroke="url(#pipeline)" stroke-width="2"/>
  <g fill="#0d1117" stroke-width="3">
    <circle cx="78" cy="252" r="7" stroke="#58a6ff"/>
    <circle cx="360" cy="252" r="7" stroke="#4ab2ef"/>
    <circle cx="642" cy="252" r="7" stroke="#3bc4d7"/>
    <circle cx="922" cy="252" r="7" stroke="#2dd4bf"/>
  </g>

  <g fill="#d7dee7" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.1">
    <text x="78" y="241">INGEST</text>
    <text x="360" y="241">ANALYZE</text>
    <text x="642" y="241">VALIDATE</text>
    <text x="922" y="241">SHIP</text>
  </g>
  <g class="mono" fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="78" y="278">PDF / files</text>
    <text x="360" y="278">PDFBox / rules</text>
    <text x="642" y="278">JUnit / CodeQL</text>
    <text x="922" y="278">Docker / CI</text>
  </g>

  <g class="motion">
    <circle cx="78" cy="252" r="11" fill="#2dd4bf" opacity=".14">
      <animate attributeName="cx" values="78;922;922" keyTimes="0;.42;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.14;.14;0;0" keyTimes="0;.03;.38;.42;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="78" cy="252" r="4" fill="#7eeadf">
      <animate attributeName="cx" values="78;922;922" keyTimes="0;.42;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.38;.42;1" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="500" y="307" fill="#8b949e" font-size="11" text-anchor="middle" letter-spacing=".55">Contracts first · Evidence over assumptions · Small, reviewable changes</text>
</svg>
