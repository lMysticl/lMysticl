<svg xmlns="http://www.w3.org/2000/svg" width="620" height="550" viewBox="0 0 620 550" role="img" aria-labelledby="title desc">
  <title id="title">Pavel Putrenkov — Java and Spring backend engineer</title>
  <desc id="desc">Java and Spring backend systems for PDF processing and multi-source APIs.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#12263A"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2C7A87" stop-opacity=".42"/><stop offset="1" stop-color="#2C7A87" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#37526B" stroke-opacity=".15"/></pattern>
    <style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; } @media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  </defs>
  <rect x=".5" y=".5" width="619" height="549" rx="22" fill="url(#background)" stroke="#344B61"/>
  <rect x="1" y="1" width="618" height="548" rx="21" fill="url(#grid)"/>

  <circle cx="530" cy="110" r="195" fill="url(#glow)"/>
  <rect x="34" y="36" width="40" height="5" rx="2.5" fill="#74E5D4"/>
  <text x="84" y="43" fill="#74E5D4" font-size="22" font-weight="700" letter-spacing="1">JAVA / SPRING · DOCUMENTS</text>
  <text x="34" y="126" fill="#F5F9FC" font-size="59" font-weight="750">Pavel Putrenkov</text>
  <text x="34" y="212" fill="#F5F9FC" font-size="50" font-weight="700">Reliable software</text>
  <text x="34" y="269" fill="#74E5D4" font-size="50" font-weight="700">for complex data.</text>
  <text x="34" y="318" fill="#C6D5E2" font-size="26">PDF analysis · multi-source APIs</text>
  <line x1="34" y1="354" x2="586" y2="354" stroke="#344B61"/>
  <rect x="34" y="376" width="552" height="67" rx="12" fill="#142539" stroke="#456077"/>
  <rect x="34" y="457" width="552" height="67" rx="12" fill="#142539" stroke="#456077"/>
  <circle cx="64" cy="410" r="7" fill="#74E5D4"/>
  <circle cx="64" cy="490" r="7" fill="#83BFFF"/>
  <line x1="64" y1="417" x2="64" y2="483" stroke="#456077" stroke-width="2"/>
  <text x="86" y="417" fill="#F5F9FC" font-size="26" font-weight="650">PDF → usable text</text>
  <text x="86" y="498" fill="#F5F9FC" font-size="26" font-weight="650">SQL + Mongo → one API</text>
</svg>
