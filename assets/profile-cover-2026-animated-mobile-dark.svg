  </g>
  <rect x="34" y="39" width="34" height="4" rx="2" fill="#E9B47A"/>
  <text x="81" y="45" fill="#E9B47A" font-size="22" font-weight="700" letter-spacing="1">SENIOR JAVA · SPRING BOOT</text>
  <text x="34" y="130" fill="#F8F5EF" font-size="59" font-weight="700">Pavel Putrenkov</text>
  <text x="34" y="218" fill="#F8F5EF" font-size="54" font-weight="700">Complex inputs.</text>
  <text x="34" y="282" fill="#E9B47A" font-size="54" font-weight="700">Clear outcomes.</text>
  <text x="34" y="339" fill="#D5D0C7" font-size="25">Reliable systems for payments,</text>
  <text x="34" y="375" fill="#D5D0C7" font-size="25">documents and developer tools.</text>
  <line x1="34" y1="491" x2="586" y2="491" stroke="#62615D" stroke-opacity=".65"/>
  <g class="motion">
