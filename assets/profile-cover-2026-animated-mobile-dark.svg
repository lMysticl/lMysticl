        <circle r="5" fill="url(#planet)" stroke="#E9B47A" stroke-opacity=".35" stroke-width=".6"/>
        <animateMotion path="M -20.598 -57.436 A 148 58 0 1 1 20.598 57.436 A 148 58 0 1 1 -20.598 -57.436" dur="25s" repeatCount="indefinite"/>
