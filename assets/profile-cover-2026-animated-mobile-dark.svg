        <circle r="6" fill="url(#planet)" stroke="#E9B47A" stroke-opacity=".35" stroke-width=".6"/>
        <animateMotion path="M -130.676 27.229 A 148 58 0 1 0 130.676 -27.229 A 148 58 0 1 0 -130.676 27.229" dur="19s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="rotate(95)">
