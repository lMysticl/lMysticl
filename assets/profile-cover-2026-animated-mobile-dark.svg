<svg xmlns="http://www.w3.org/2000/svg" width="620" height="580" viewBox="0 0 620 580" role="img" aria-labelledby="title desc">
  <title id="title">Pavel Putrenkov — Senior Java Engineer</title>
  <desc id="desc">Pavel Putrenkov, Senior Java Engineer. Complex inputs, clear outcomes.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#111318"/><stop offset="1" stop-color="#20242B"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#BE8751" stop-opacity=".16"/><stop offset="1" stop-color="#BE8751" stop-opacity="0"/></radialGradient>
    <linearGradient id="streak"><stop stop-color="#E9B47A" stop-opacity="0"/><stop offset=".5" stop-color="#E9B47A"/><stop offset="1" stop-color="#E9B47A" stop-opacity="0"/></linearGradient>
    <radialGradient id="planet" cx=".3" cy=".25" r=".8"><stop stop-color="#FFF0DB"/><stop offset=".45" stop-color="#E9B47A"/><stop offset="1" stop-color="#A96C3D"/></radialGradient>
    <radialGradient id="planet-halo"><stop stop-color="#E9B47A" stop-opacity=".2"/><stop offset="1" stop-color="#E9B47A" stop-opacity="0"/></radialGradient>
    <style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; } text.monogram { font-family: Georgia, "Times New Roman", serif; } .orbit-still { display: none; } @media (prefers-reduced-motion: reduce) { .motion { display: none; } .orbit-still { display: inline; } }</style>
  </defs>
  <rect x=".5" y=".5" width="619" height="579" rx="18" fill="url(#background)" stroke="#373B41"/>

  <circle cx="510" cy="461" r="160" fill="url(#glow)"/>
  <g id="orbital-monogram" transform="translate(505 447) scale(.66)">
