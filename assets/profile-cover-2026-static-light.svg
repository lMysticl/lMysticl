<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Pavel Putrenkov — complex inputs, clear outcomes</title>
  <desc id="desc">Pavel Putrenkov, Senior Java Engineer. Complex inputs, clear outcomes.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#FAF7F0"/><stop offset="1" stop-color="#EEE9E0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#D6B18B" stop-opacity=".16"/><stop offset="1" stop-color="#D6B18B" stop-opacity="0"/></radialGradient>
    <linearGradient id="streak"><stop stop-color="#9E562E" stop-opacity="0"/><stop offset=".5" stop-color="#9E562E"/><stop offset="1" stop-color="#9E562E" stop-opacity="0"/></linearGradient>
    <radialGradient id="planet" cx=".3" cy=".25" r=".8"><stop stop-color="#F3D2A5"/><stop offset=".45" stop-color="#B77644"/><stop offset="1" stop-color="#713B20"/></radialGradient>
    <radialGradient id="planet-halo"><stop stop-color="#9E562E" stop-opacity=".2"/><stop offset="1" stop-color="#9E562E" stop-opacity="0"/></radialGradient>
    <style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; } text.monogram { font-family: Georgia, "Times New Roman", serif; } @media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="429" rx="18" fill="url(#background)" stroke="#D8D0C5"/>

  <circle cx="997" cy="195" r="260" fill="url(#glow)"/>
  <g id="orbital-monogram" transform="translate(995 211)">
    <circle r="154" fill="none" stroke="#9E562E" stroke-opacity=".15"/>
    <ellipse rx="148" ry="58" transform="rotate(-25)" fill="none" stroke="#9E562E" stroke-opacity=".32" stroke-width="1.25"/>
    <ellipse rx="148" ry="58" transform="rotate(35)" fill="none" stroke="#9E562E" stroke-opacity=".24" stroke-width="1.25"/>
    <ellipse rx="148" ry="58" transform="rotate(95)" fill="none" stroke="#9E562E" stroke-opacity=".20" stroke-width="1.25"/>
    <text class="monogram" x="-105" y="100" fill="#9E562E" fill-opacity=".25" font-size="285" font-style="italic">P</text>
    <g transform="rotate(-25)">
      <g class="satellite" transform="translate(135.205 23.591)">
        <circle r="20.8" fill="url(#planet-halo)"/>
        <circle r="8" fill="url(#planet)" stroke="#9E562E" stroke-opacity=".35" stroke-width=".6"/>
      </g>
    </g>
    <g transform="rotate(35)">
      <g class="satellite" transform="translate(-130.676 27.229)">
        <circle r="15.600000000000001" fill="url(#planet-halo)"/>
        <circle r="6" fill="url(#planet)" stroke="#9E562E" stroke-opacity=".35" stroke-width=".6"/>
      </g>
    </g>
    <g transform="rotate(95)">
      <g class="satellite" transform="translate(-20.598 -57.436)">
        <circle r="13.0" fill="url(#planet-halo)"/>
        <circle r="5" fill="url(#planet)" stroke="#9E562E" stroke-opacity=".35" stroke-width=".6"/>
      </g>
    </g>
  </g>
  <rect x="60" y="47" width="38" height="4" rx="2" fill="#9E562E"/>
  <text x="111" y="52" fill="#9E562E" font-size="18" font-weight="700" letter-spacing="2">SENIOR JAVA ENGINEER · SPRING BOOT</text>
  <text x="60" y="133" fill="#202124" font-size="58" font-weight="700">Pavel Putrenkov</text>
  <text x="60" y="221" fill="#202124" font-size="62" font-weight="700">Complex inputs.</text>
  <text x="60" y="291" fill="#9E562E" font-size="62" font-weight="700">Clear outcomes.</text>
  <text x="60" y="339" fill="#4E4D49" font-size="21">Payments, documents and dependable APIs.</text>
  <line x1="60" y1="377" x2="1140" y2="377" stroke="#A9A096" stroke-opacity=".65"/>
  <text x="60" y="409" fill="#64635E" font-size="16" font-weight="600" letter-spacing="1.5">PAYMENTS  /  DOCUMENTS  /  DEVELOPER TOOLING</text>
</svg>
