<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Pavel Putrenkov — reliable software for complex data</title>
  <desc id="desc">Java and Spring backend systems for PDF processing and multi-source APIs.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#12263A"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2C7A87" stop-opacity=".42"/><stop offset="1" stop-color="#2C7A87" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#37526B" stroke-opacity=".15"/></pattern>
    <style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; } @media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="379" rx="22" fill="url(#background)" stroke="#344B61"/>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="url(#grid)"/>

  <circle cx="1020" cy="100" r="265" fill="url(#glow)"/>
  <rect x="48" y="42" width="46" height="5" rx="2.5" fill="#74E5D4"/>
  <text x="106" y="49" fill="#74E5D4" font-size="18" font-weight="700" letter-spacing="2">JAVA / SPRING · DOCUMENT SYSTEMS</text>
  <text x="48" y="125" fill="#F5F9FC" font-size="56" font-weight="750">Pavel Putrenkov</text>
  <text x="48" y="197" fill="#F5F9FC" font-size="48" font-weight="700">Reliable software</text>
  <text x="48" y="251" fill="#74E5D4" font-size="48" font-weight="700">for complex data.</text>
  <text x="48" y="300" fill="#C6D5E2" font-size="20">PDF analysis · multi-source APIs · clear contracts</text>
  <line x1="48" y1="331" x2="753" y2="331" stroke="#344B61"/>
  <text x="48" y="357" fill="#9FB6C7" font-size="17" font-weight="600" letter-spacing="1">JAVA 21  /  SPRING BOOT  /  PDFBOX</text>
  <rect x="804" y="40" width="344" height="298" rx="19" fill="#142539" stroke="#456077"/>
  <text x="833" y="75" fill="#9FB6C7" font-size="16" font-weight="700" letter-spacing="1.7">FROM INPUT TO EVIDENCE</text>
  <line x1="847" y1="114" x2="847" y2="281" stroke="#456077" stroke-width="2"/>
  <circle cx="847" cy="116" r="6" fill="#74E5D4"/>
  <circle cx="847" cy="195" r="6" fill="#83BFFF"/>
  <circle cx="847" cy="274" r="6" fill="#74E5D4"/>
  <g class="motion">
    <circle cx="847" cy="116" r="18" fill="#74E5D4" opacity="0">
      <animate attributeName="cy" values="116;274;274" keyTimes="0;.65;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.17;.17;0;0" keyTimes="0;.07;.56;.65;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="847" cy="116" r="5" fill="#74E5D4" opacity="0">
      <animate attributeName="cy" values="116;274;274" keyTimes="0;.65;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.07;.56;.65;1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="872" y="111" fill="#9FB6C7" font-size="15" font-weight="700" letter-spacing="1">01 / DOCUMENTS</text>
  <text x="872" y="139" fill="#F5F9FC" font-size="21" font-weight="650">PDF → usable text</text>
  <text x="872" y="190" fill="#9FB6C7" font-size="15" font-weight="700" letter-spacing="1">02 / DATA SOURCES</text>
  <text x="872" y="218" fill="#F5F9FC" font-size="21" font-weight="650">SQL + Mongo → API</text>
  <text x="872" y="269" fill="#9FB6C7" font-size="15" font-weight="700" letter-spacing="1">03 / DELIVERY</text>
  <text x="872" y="297" fill="#F5F9FC" font-size="21" font-weight="650">Test → release</text>
</svg>
