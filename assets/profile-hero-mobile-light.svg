    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9FC4D1" stroke-opacity=".15"/></pattern>
    <style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }</style>
  </defs>
  <rect x=".5" y=".5" width="619" height="549" rx="22" fill="url(#background)" stroke="#C5D7E1"/>
