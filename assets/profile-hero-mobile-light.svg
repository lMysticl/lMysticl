<svg xmlns="http://www.w3.org/2000/svg" width="620" height="550" viewBox="0 0 620 550" role="img" aria-labelledby="title desc">
  <title id="title">Pavel Putrenkov — Java and Spring backend engineer</title>
  <desc id="desc">Java and Spring backend systems for PDF processing and multi-source APIs.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#F7FAFF"/><stop offset="1" stop-color="#E8F3F6"/></linearGradient>
