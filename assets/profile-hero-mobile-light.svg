  <text x="34" y="126" fill="#102536" font-size="59" font-weight="750">Pavel Putrenkov</text>
  <text x="34" y="212" fill="#102536" font-size="50" font-weight="700">Reliable software</text>
  <text x="34" y="269" fill="#087C71" font-size="50" font-weight="700">for complex data.</text>
